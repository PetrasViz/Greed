{% extends 'base.html' %}
{% block content %}
<h1 class="title">Profile</h1>
<form method="post">
  <div class="field">
    <label class="label">Email</label>
    <div class="control">
      <input class="input" type="email" name="email" value="{{ current_user.email }}">
    </div>
  </div>
  <div class="field">
    <label class="label">Display Name</label>
    <div class="control">
      <input class="input" type="text" name="display_name" value="{{ current_user.display_name }}">
    </div>
  </div>
  <div class="field">
    <label class="label">Game Role</label>
    <div class="control">
      <input class="input" type="text" name="game_role" value="{{ current_user.game_role }}">
    </div>
  </div>
  <div class="field">
    <div class="control">
      <button class="button is-link" type="submit">Update</button>
    </div>
  </div>
</form>
{% endblock %}
